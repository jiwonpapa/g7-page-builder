name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: module-dist
          path: dist

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer check

  g7-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gnuboard/g7
          ref: 0e8b625436df7fb30cf1632f42d9d6bcb39ac37b
          path: .runtime/gnuboard7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, sqlite3
          tools: composer
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer install --no-interaction --no-progress --prefer-dist
        working-directory: .runtime/gnuboard7
      - run: vendor/bin/phpstan analyse --autoload-file=.runtime/gnuboard7/vendor/autoload.php -c phpstan-g7.neon.dist --memory-limit=1G --no-progress
      - run: vendor/bin/phpunit --bootstrap tests/Integration/bootstrap.php tests/Integration
