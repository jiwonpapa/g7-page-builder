name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Reviewed base commit for continuing an incomplete verification scope
        required: true
        type: string

permissions:
  contents: read

# A feature branch is checked by its PR, not again by a second push workflow.
concurrency:
  group: scoped-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Seoul
      PYTHONDONTWRITEBYTECODE: '1'
      BASE_REF: ${{ inputs.base_ref || github.event.pull_request.base.sha || github.event.before }}
      CI_RUNTIME_TASK: ci-runtime-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Prepare controller tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ripgrep
      - uses: actions/cache/restore@v4
        with:
          path: .git/g7pb-coordination-v1/python-checks
          key: ${{ runner.os }}-g7pb-gates-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-g7pb-gates-v1-
      # Planning itself imports TypeScript/PostCSS; prepare those first.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Prepare planning dependencies
        run: python3 scripts/g7pb.py environment deps --only npm --apply
      - name: Resolve the same verification plan as local development
        id: plan
        run: |
          [[ "$BASE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'A reviewed full base SHA is required'; exit 2; }
          git merge-base --is-ancestor "$BASE_REF" HEAD
          mkdir -p .runtime
          python3 scripts/g7pb.py plan --base "$BASE_REF" --phase ci --json --save-plan .runtime/ci-resolved.json > .runtime/ci-plan.json
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          plan = json.loads(Path('.runtime/ci-plan.json').read_text())
          if plan.get('unresolved'):
              print('Unresolved scope; no automatic full validation:', plan['unresolved'], file=sys.stderr)
              sys.exit(1)
          required = plan['requirements']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              coverage = any(gate['name'] == 'php-compiler-coverage' for gate in plan['gates'])
              print(f'compiler_coverage={str(coverage).lower()}', file=output)
              for name in ('node', 'php', 'g7', 'browser'):
                  if not isinstance(required[name], bool):
                      raise ValueError(f'Invalid requirement: {name}')
                  print(f'{name}={str(required[name]).lower()}', file=output)
          PY
      - uses: shivammathur/setup-php@v2
        if: steps.plan.outputs.php == 'true' || steps.plan.outputs.g7 == 'true'
        with:
          php-version: '8.5'
          extensions: zip, mbstring, pdo_sqlite, sqlite3
          tools: composer
          coverage: ${{ steps.plan.outputs.compiler_coverage == 'true' && 'xdebug' || 'none' }}
      - uses: actions/cache@v4
        if: steps.plan.outputs.node == 'true' || steps.plan.outputs.php == 'true'
        with:
          path: |
            node_modules
            vendor
            .runtime/harness/environment.json
          key: g7pb-deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.plan.outputs.node }}-${{ steps.plan.outputs.php }}-${{ steps.plan.outputs.g7 }}-${{ hashFiles('package-lock.json', 'composer.lock') }}
          restore-keys: g7pb-deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.plan.outputs.node }}-${{ steps.plan.outputs.php }}-${{ steps.plan.outputs.g7 }}-
      - name: Prepare only selected PHP dependencies
        if: steps.plan.outputs.php == 'true' || steps.plan.outputs.g7 == 'true'
        run: python3 scripts/g7pb.py environment deps --only composer --apply
      - uses: actions/checkout@v5
        if: steps.plan.outputs.g7 == 'true'
        with:
          repository: gnuboard/g7
          ref: 0e8b625436df7fb30cf1632f42d9d6bcb39ac37b
          path: .runtime/gnuboard7
      - uses: actions/cache@v4
        if: steps.plan.outputs.g7 == 'true'
        with:
          path: |
            .runtime/gnuboard7/vendor
            .runtime/gnuboard7/.runtime/harness/environment.json
          key: g7pb-g7-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.runtime/gnuboard7/composer.lock') }}
      - name: Prepare pinned public G7 contract dependencies
        if: steps.plan.outputs.g7 == 'true'
        run: python3 scripts/g7pb.py environment deps --root .runtime/gnuboard7 --only composer --apply
      - uses: docker/setup-buildx-action@v3
        if: steps.plan.outputs.browser == 'true' || steps.plan.outputs.g7 == 'true'
      - uses: docker/build-push-action@v6
        if: steps.plan.outputs.browser == 'true' || steps.plan.outputs.g7 == 'true'
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: g7pb-dev-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prepare an isolated installed browser runtime
        if: steps.plan.outputs.browser == 'true' || steps.plan.outputs.g7 == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mkcert jq
          echo '127.0.0.1 g7pb.test' | sudo tee -a /etc/hosts
          python3 scripts/g7pb.py ci_runtime prepare --task "$CI_RUNTIME_TASK"
      - name: Execute the resolved gates once
        run: |
          args=()
          if [[ '${{ steps.plan.outputs.g7 }}' == true || '${{ steps.plan.outputs.browser }}' == true ]]; then
            args=(--task "$CI_RUNTIME_TASK")
          fi
          python3 scripts/g7pb.py run --base "$BASE_REF" --phase ci --plan .runtime/ci-resolved.json "${args[@]}"
      # Preserve completed ordinary checks even when a later gate fails.
      # Gate fingerprints still validate command, inputs and tool environment.
      - uses: actions/cache/save@v4
        if: always() && !cancelled()
        with:
          path: .git/g7pb-coordination-v1/python-checks
          key: ${{ runner.os }}-g7pb-gates-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always() && (steps.plan.outputs.g7 == 'true' || steps.plan.outputs.browser == 'true')
        with:
          name: selected-browser-evidence
          path: output/playwright/gates/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-plan
          path: .runtime/ci-plan.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success() && hashFiles('dist/**') != ''
        with:
          name: module-dist
          path: dist
